name: Keep scheduled workflows active

# GitHub disables scheduled workflows after 60 days without repository activity.
# Run by hand, keepalive-reminder.yml sends a monthly reminder to do so.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "ices-github-bot"
          git config user.email "github@ices.dk"
          git commit --allow-empty -m "Keep scheduled workflows active"
          git push
